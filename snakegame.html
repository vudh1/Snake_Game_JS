<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daniel - Snake Game</title>
    <link rel="stylesheet" href="snakeCSS.css" />
  </head>
  <body>
    <main class="game">
      <h1>Snake</h1>
      <div class="hud">
        <span>Score: <strong id="score">0</strong></span>
        <span>Mode: <strong id="mode">Autopilot</strong></span>
      </div>
      <canvas id="snakeboard" width="800" height="800" aria-label="Snake game board"></canvas>
      <p class="controls">Arrow keys: manual control · A: toggle autopilot · R: restart</p>
      <p id="status" class="status" aria-live="polite"></p>
    </main>
    <script src="snakeJS.js"></script>
  </body>
</html>
